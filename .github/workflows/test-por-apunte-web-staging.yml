name: BCPOL web - test por apunte (staging)
on:
  push:
    branches:
      - test-por-apunte-web-staging-20261105
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar enlaces y controles del piloto
        run: python -m unittest discover -s tests -p 'test_apuntes_test_links.py' -v
