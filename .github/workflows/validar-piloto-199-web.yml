name: BCPOL validar web privada 199 apuntes
on:
  push:
    branches: [piloto-199-apuntes-web-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar 199 enlaces y acceso exclusivo de administrador
        run: python -m unittest discover -s tests -p 'test_piloto_199_links.py' -v
      - name: Comprobar JavaScript
        run: |
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('apuntes.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          pathlib.Path('/tmp/apuntes-199.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/apuntes-199.js
